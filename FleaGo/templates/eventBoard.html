<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/eventBoard.css') }}"></head>
    <title>채널 이벤트 게시판</title>
    
</head>
<body>
    <h1>채널 이벤트 게시판</h1>

    {% for e in events %}
    <div style="border:1px solid #ccc; padding:10px; margin-bottom:15px;">
        <img src="{{ url_for('static', filename='uploads/' + e.profile_image) }}" width="50" alt="채널 이미지">
        <h2>{{ e.channel_name }} - {{ e.title }}</h2>
        <p><strong>일시:</strong> {{ e.start_date }} {{ e.start_time }} ~ {{ e.end_date }} {{ e.end_time }}</p>
        <a href="{{ url_for('board.read_event', event_id=e.event_id) }}">상세보기</a>
    </div>
    {% endfor %}
</body>
</html>
