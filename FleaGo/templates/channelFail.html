<!DOCTYPE html> <!-- HTML 문서 선언 -->
<html lang="en"> <!-- 페이지 기본 언어 -->

<head> <!-- head 영역 시작 -->
    <meta charset="UTF-8"> <!-- 문자 인코딩 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 반응형 -->
    <title>채널 개설 실패</title> <!-- 페이지 제목 -->
   <link rel="stylesheet" href="{{ url_for('static', filename='css/channelFail.css') }}">

</head> <!-- head 끝 -->

<body id="channelFail-body"> <!-- body 시작 -->

    <section id="channelFail-section"> <!-- 전체 콘텐츠를 감싸는 영역 -->

        <div id="channelFail-container"> <!-- 메인 박스 -->

            <h1 id="channelFail-title">채널 개설</h1> <!-- 제목 -->
            <h3 id="channelFail-text1">1) 채널 개설</h3> <!-- 안내 문구 -->
            <h3 id="channelFail-text2"><strong>2) 완료</strong></h3> <!-- 안내 문구 -->


            <h2 id="channelFail-text3">채널 개설 실패!</h2> <!-- 안내 문구 -->

            <p id="channelFail-text4">채널 개설을 다시 시도해보세요.</p> <!-- 안내 문구 -->

            <button type="button" id="retry-btn" class="retry-btn" onclick="window.location.href='{{ url_for('channel.channel_dashboard') }}'">다시 개설하기</button>

        </div> <!-- container 종료 -->

    </section> <!-- section 종료 -->

    <!-- Flash 메시지 처리 -->
    <script>
        const messages = {{ get_flashed_messages() | tojson  }};
        messages.forEach(msg => alert(msg));
    </script>

</body> <!-- body 종료 -->


</html> <!-- HTML 문서 종료 -->
