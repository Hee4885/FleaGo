<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>

<body>
    <header></header>
    <section id="login">
        <div class="LoginInput-box">
            <a href="./index.html">
                <img id="login-logo" src="./img/home/Logo2.png" alt="로고">
            </a>
            <!-- (로그인)아이디, 비번 /아이디, 비번,이름, (회원가입)이메일,확인 숫자(고민) -->
            <p id="guide-line">행복한 시작은 지금 부터, <br> 로그인하고 <strong>플리고</strong>와 함께해요!</p>
            <p id="id-text">아이디를 입력하세요.</p>
            <input id="id-input" type="text" placeholder="아이디 입력">
            <p id="password-text">비밀번호를 입력하세요.</p>
            <input id="password-input" type="text" placeholder="비밀번호 입력">
            <button id="btnLogin">로그인</button>
            <a href="./signUp.html" id="linkSignUp">아직 계정이 없으신가요?</a>
        </div>
    </section>
    <footer></footer>
</body>

</html>
