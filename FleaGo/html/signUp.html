<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/signUp.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>

<body>
    <section id="login">
        <div class="SignUpInput-box">
            <a href="./index.html">
                <img id="login-logo" src="./img/home/Logo2.png" alt="로고">
            </a>
            <!-- (로그인)아이디, 비번 /아이디, 비번,이름, (회원가입)이메일,확인 숫자(고민) -->
            <p id="guide-line"><strong>플리고</strong>와 첫 걸음, <br> 진심으로 환영합니다!</p>

            <p id="id-text">아이디를 입력하세요.</p>
            <input id="id-input" type="text" placeholder="아이디 입력">

            <p id="password-text">비밀번호를 입력하세요.</p>
            <input id="password-input" type="text" placeholder="비밀번호 입력">

            <p id="RePassword-text">*비밀번호를 확인하세요.</p>
            <input id="password-Reinput" type="text" placeholder="비밀번호 재입력">

            <p id="email-text">이메일을 입력하세요.</p>
            <input id="email-input" type="text" placeholder="email@example.com">
            
            <!-- <input id="checkNumber-input" type="text" placeholder="체크 메세지 입력"> -->
            
            <button id="password-btnCheck">비밀번호 확인</button>
            
            <button id="btnLogin">회원가입</button>
            <a href="./login.html" id="linkSignUp">이미 계정이 있으신가요?</a>
        </div>
    </section>
</body>

</html>
