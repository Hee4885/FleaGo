<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="test.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프론트 연습</title>
</head>

<body>
    <div >
        <input type="number" class="box" id="num1" placeholder="첫번째로 입력할 숫자">     
        <input type="number" class="box" id="num2" placeholder="두번째로 입력할 숫자"> 
        <select class="box" id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select> 
        <button class="box" onclick="calculateNum()">계산하기</button>
    </div>
    <div id="result"></div>

    <script>
        //비동기(async) 함수 정의 -> fetch로 백엔드에 요청
        async function calculateNum(){
            //입력값 가져오기
            const n1 = document.getElementById("num1").value;
            const n2 = document.getElementById("num2").value;

            //선택된 연산자 가져오기
            const op = document.getElementById("operator").value;
            
            //결과 표시를 위한 div 선택
            const result = document.getElementById("result");


            /*
                await : 서버 응답까지 기다림
                fetch : 백엔드 /calculate에 POST 요청
                JSON 형태로 숫자와 연산자 전달
            */
            const res = await fetch("http://127.0.0.1:5000/calculate",{
                method : "POST",
                headers : {"Content-Type" : "application/json"},
                body : JSON.stringify({num1:n1, num2:n2, operator:op})
            });

            //서버에서 반환한 JSON 데이터를 JS 객체로 변환
            const data = await res.json();

            //data라는 객체 안에 있는 result 속성을 가져와서 화면에 표시
            result.textContent = "결과 : " + data.result;
        }
    </script>
</body>

</html>
